<div style="background:#141414; min-height:100vh; padding:20px;">
  
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #e50914; padding-bottom:16px;">
    <h1 style="color:#e50914; margin:0;">🎬 NetflixApp</h1>
    <button (click)="goBack()" style="background:transparent; color:white; border:1px solid white; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:1rem;">← Volver</button>
  </div>
  
  <h2 style="color:white; margin-bottom:24px;">❤️ Mis Películas</h2>
  
  <p *ngIf="movies.length === 0" style="color:#aaa;">No has guardado ninguna película aún.</p>
  
  <div style="display:flex; flex-wrap:wrap; gap:16px;">
    
    <!-- TARJETA SIN BOTÓN ROJO DE "VER" -->
    <div *ngFor="let movie of movies" 
      style="width:170px; background:#1e1e1e; border-radius:8px; overflow:hidden; text-align:center;">
      
      <img [src]="movie.image" [alt]="movie.title" style="width:100%; height:240px; object-fit:cover; display:block;">
      
      <div style="padding:12px 8px;">
        <h3 style="color:white; font-size:0.85rem; margin:0 0 8px 0; min-height:40px; display:flex; align-items:center; justify-content:center;">
          {{ movie.title }}
        </h3>
        
        <span style="color:#e50914; font-size:0.75rem; display:block;">
          {{ movie.category }}
        </span>
      </div>
      
    </div>
    
  </div>
</div>
