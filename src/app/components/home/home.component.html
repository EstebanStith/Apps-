<div style="background:#141414; min-height:100vh;">

  <div style="display:flex; justify-content:space-between; align-items:center; background:#141414; padding:16px 32px; border-bottom:2px solid #e50914;">
    <h1 style="color:#e50914; margin:0;">🎬 NetflixApp</h1>
    <button (click)="goToMyMovies()" style="background:#e50914; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-size:1rem; font-weight:bold;">
      Mis Películas ❤️
    </button>
  </div>

  <div style="padding:20px 32px;">
    <div *ngFor="let cat of categories" style="margin-bottom:40px;">
      <h2 style="color:white; margin-bottom:16px;">{{ cat.name }}</h2>
      
      <!-- Fila horizontal con scroll -->
      <div style="display:flex; flex-direction:row; gap:16px; overflow-x:auto; padding-bottom:10px;">
        
        <!-- TARJETA ESTILO "MIS PELÍCULAS" -->
        <div *ngFor="let movie of cat.movies"
          style="min-width:170px; max-width:170px; background:#1e1e1e; border-radius:8px; overflow:hidden; text-align:center; flex-shrink:0; display:flex; flex-direction:column; justify-content:space-between;">
          
          <img [src]="movie.image" [alt]="movie.title"
            style="width:100%; height:240px; object-fit:cover; display:block;">
            
          <div style="padding:12px 8px;">
            <h3 style="color:white; font-size:0.85rem; margin:0 0 8px 0; min-height:40px; display:flex; align-items:center; justify-content:center;">
              {{ movie.title }}
            </h3>
            <span style="color:#e50914; font-size:0.75rem; display:block; padding-bottom:12px;">
              {{ movie.category }}
            </span>
            <button (click)="goToDetail(movie.id)"
              style="background:#e50914; color:white; border:none; width:100%; padding:10px; cursor:pointer; font-size:0.9rem; font-weight:bold; border-radius:4px;">
              ▶ Ver
            </button>
          </div>

        </div>
        <!-- FIN TARJETA -->

      </div>
    </div>
  </div>

</div>
